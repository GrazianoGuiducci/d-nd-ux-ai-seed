<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Una sessione finisce. Il lavoro utile può continuare.</title><desc id="d">Tre momenti collegati: lavoro, sorgente durevole, lavoro successivo.</desc><rect width="1200" height="630" fill="#c7ecec"/><circle cx="1060" cy="90" r="220" fill="#e6e5a9"/><circle cx="95" cy="580" r="155" fill="none" stroke="#8b4bb1" stroke-width="3" opacity=".55"/><text x="72" y="70" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="800" fill="#14313a">MAIOS</text><text x="72" y="178" font-family="Segoe UI,Arial,sans-serif" font-size="62" font-weight="650" letter-spacing="-2.6" fill="#14313a">Una sessione finisce.</text><text x="72" y="246" font-family="Segoe UI,Arial,sans-serif" font-size="62" font-weight="350" letter-spacing="-2.6" fill="#14313a">Il lavoro utile può continuare.</text><line x1="132" y1="365" x2="1060" y2="365" stroke="#14313a" stroke-width="3"/><circle cx="132" cy="365" r="12" fill="#14313a"/><circle cx="596" cy="365" r="12" fill="#14313a"/><circle cx="1060" cy="365" r="12" fill="#14313a"/><g font-family="Segoe UI,Arial,sans-serif" fill="#14313a"><text x="132" y="418" font-size="23" font-weight="650" text-anchor="middle">Lavoro</text><text x="132" y="451" font-size="18" text-anchor="middle" fill="#35545c">decisione · correzione</text><text x="596" y="418" font-size="23" font-weight="650" text-anchor="middle">Sorgente tua</text><text x="596" y="451" font-size="18" text-anchor="middle" fill="#35545c">ragioni · metodo · competenze</text><text x="1060" y="418" font-size="23" font-weight="650" text-anchor="middle">Lavoro successivo</text><text x="1060" y="451" font-size="18" text-anchor="middle" fill="#35545c">riparti dal punto che conta</text></g><text x="72" y="570" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#35545c">Il kernel rende raggiungibile ciò che deve poter partecipare ancora.</text></svg>
