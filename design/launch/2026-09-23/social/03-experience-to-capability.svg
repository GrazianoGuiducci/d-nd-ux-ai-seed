<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Una correzione utile può diventare capacità</title><desc id="d">Una correzione attraversa il kernel e cambia il modo di affrontare un task successivo diverso.</desc><rect width="1200" height="630" fill="#b9d8c5"/><path d="M0 525 C240 440 400 600 660 500 C860 425 1000 455 1200 375 L1200 630 L0 630Z" fill="#e6e5a9"/><text x="72" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="800" fill="#14313a">MAIOS</text><text x="72" y="174" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="650" letter-spacing="-2.4" fill="#14313a">Una correzione utile</text><text x="72" y="238" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="350" letter-spacing="-2.4" fill="#14313a">può diventare capacità.</text><g transform="translate(74 330)" font-family="Segoe UI,Arial,sans-serif" fill="#14313a"><rect x="0" y="0" width="270" height="128" rx="6" fill="#fff8e4" stroke="rgba(20,49,58,.25)"/><text x="22" y="38" font-size="16" font-weight="700">TASK A</text><text x="22" y="74" font-size="22" font-weight="650">“Questa è inferenza,</text><text x="22" y="101" font-size="22">non fatto dalla fonte.”</text><path d="M292 64 H430" stroke="#14313a" stroke-width="3"/><polygon points="430,64 414,55 414,73" fill="#14313a"/><circle cx="550" cy="64" r="82" fill="#f7d993" stroke="#14313a" stroke-width="2"/><text x="550" y="58" text-anchor="middle" font-size="18" font-weight="700">competenza</text><text x="550" y="84" text-anchor="middle" font-size="16">cambia metodo</text><path d="M632 64 H770" stroke="#14313a" stroke-width="3"/><polygon points="770,64 754,55 754,73" fill="#14313a"/><rect x="792" y="0" width="270" height="128" rx="6" fill="#fff8e4" stroke="rgba(20,49,58,.25)"/><text x="814" y="38" font-size="16" font-weight="700">TASK B · DIVERSO</text><text x="814" y="74" font-size="21" font-weight="650">Fonte e inferenza</text><text x="814" y="101" font-size="21">restano distinte.</text></g><text x="72" y="566" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#35545c">Non conserva soltanto il risultato: può cambiare il modo di lavorare dopo.</text></svg>
