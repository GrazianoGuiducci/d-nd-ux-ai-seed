<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Due kernel, due superfici naturali</title>
<desc id="desc">kernel_chat entra da un ambiente AI con ingresso persistente e sorgente raggiungibile. Project Kernel entra dal repository o filesystem del progetto. Possono partecipare allo stesso lavoro quando il setup lo permette, senza implicare sincronizzazione automatica fra provider.</desc>
<rect width="1200" height="630" fill="#c7ecec"/>
<rect x="590" width="610" height="630" fill="#e6e5a9"/>
<text x="72" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#14313a">MAIOS</text>
<text x="72" y="150" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#14313a">Lavori in una chat AI</text>
<text x="72" y="208" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="650" fill="#14313a">kernel_chat</text>
<text x="72" y="260" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#35545c">ingresso persistente + sorgente raggiungibile</text>
<rect x="72" y="312" width="410" height="128" rx="6" fill="#fff8e4" stroke="#14313a" stroke-width="2"/>
<text x="98" y="354" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" fill="#14313a">continuità conversazionale</text>
<text x="98" y="389" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#14313a">contesto · competenze · apprendimento</text>
<text x="98" y="421" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#14313a">in una sorgente tua</text>

<text x="664" y="150" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#14313a">Lavori dentro un progetto</text>
<text x="664" y="208" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="650" fill="#14313a">Project Kernel</text>
<text x="664" y="260" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#35545c">repository + filesystem + continuità locale</text>
<rect x="664" y="312" width="464" height="128" rx="6" fill="#fff8e4" stroke="#14313a" stroke-width="2"/>
<text x="690" y="354" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" fill="#14313a">continuità nel progetto</text>
<text x="690" y="389" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#14313a">fonti · ragioni · competenze</text>
<text x="690" y="421" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#14313a">insieme al lavoro del coder</text>

<line x1="72" y1="500" x2="1128" y2="500" stroke="#14313a" stroke-opacity=".25"/>
<text x="72" y="540" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#14313a">Due ingressi distinti.</text>
<text x="284" y="540" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#35545c">Possono partecipare allo stesso lavoro quando il setup espone entrambe le relazioni.</text>
<text x="72" y="582" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#35545c">Nessuna sincronizzazione automatica fra provider è implicata.</text>
</svg>
